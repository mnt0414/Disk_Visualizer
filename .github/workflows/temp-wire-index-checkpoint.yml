name: Temporary wire index checkpoint
on:
  push:
    branches: [feat/index-checkpoint-storage]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/index-checkpoint-storage
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          storage=Path('src-tauri/src/storage.rs')
          text=storage.read_text().replace('            6 => {}', '            6 | 7 => {}')
          storage.write_text(text)
          lib=Path('src-tauri/src/lib.rs')
          text=lib.read_text()
          text=text.replace('mod file_metrics;\npub mod index_trust;', 'mod file_metrics;\npub mod index_checkpoint;\npub mod index_trust;')
          text=text.replace('use cache_query::{CacheEntryDetail, CacheQueryRepository};', 'use cache_query::{CacheEntryDetail, CacheQueryRepository};\nuse index_checkpoint::IndexCheckpointRepository;')
          text=text.replace('            let repository = ScanRepository::new(database_path);\n            repository.initialize().map_err(std::io::Error::other)?;', '            let checkpoint_repository = IndexCheckpointRepository::new(database_path.clone());\n            let repository = ScanRepository::new(database_path);\n            repository.initialize().map_err(std::io::Error::other)?;\n            checkpoint_repository\n                .initialize()\n                .map_err(std::io::Error::other)?;')
          text=text.replace('            app.manage(ScanManager::new(repository.clone()));', '            app.manage(ScanManager::new(repository.clone()));\n            app.manage(checkpoint_repository);')
          lib.write_text(text)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/index_checkpoint.rs src-tauri/src/storage.rs src-tauri/src/lib.rs
          git commit -m "feat: wire SQLite v7 checkpoint migration"
          git push origin HEAD:feat/index-checkpoint-storage
