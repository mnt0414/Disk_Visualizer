name: Temporary catalog v2 fix

on:
  push:
    branches: [feat/adobe-blender-catalog-v2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adobe-blender-catalog-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Update stored catalog expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/storage.rs')
          text = path.read_text()
          old = '        assert_eq!(stored.0, "2026.08.1");\n'
          new = '        assert_eq!(stored.0, "2026.08.2");\n'
          if text.count(old) != 1:
              raise SystemExit('stored catalog expectation not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/cache_catalog.rs src-tauri/src/storage.rs
          git commit -m "fix: align catalog v2 tests and formatting"
          git push origin HEAD:feat/adobe-blender-catalog-v2
