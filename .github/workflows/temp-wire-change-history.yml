name: Temporary wire change history
on:
  push:
    branches: [feat/change-history-continuity]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/change-history-continuity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src-tauri/src/lib.rs')
          text=path.read_text().replace('pub mod cache_activity;\n', 'pub mod cache_activity;\npub mod change_history;\n')
          path.write_text(text)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/change_history.rs src-tauri/src/lib.rs
          git commit -m "feat: wire change history continuity model"
          git push origin HEAD:feat/change-history-continuity
