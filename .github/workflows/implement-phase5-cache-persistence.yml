name: Finalize Phase 5 cache persistence

on:
  push:
    branches: [feat/phase5-persist-cache-classification]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase5-persist-cache-classification
      - name: Add cache index to fresh databases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/storage.rs')
          text = path.read_text()
          old = 'CREATE INDEX scan_entries_scan_parent ON scan_entries(scan_id,parent_path); PRAGMA user_version=5;'
          new = 'CREATE INDEX scan_entries_scan_parent ON scan_entries(scan_id,parent_path); CREATE INDEX scan_entries_scan_cache ON scan_entries(scan_id,cache_definition_id); PRAGMA user_version=5;'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected fresh-schema marker count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/storage.rs
          git commit -m "fix: index cache definitions in fresh databases"
          git push
