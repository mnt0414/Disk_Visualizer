name: Diagnose Windows handle snapshot

on:
  push:
    branches: [fix/phase4-handle-snapshot-toctou]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-handle-snapshot-toctou
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Windows allocation size type fix
        shell: pwsh
        run: |
          $path = 'src-tauri/src/file_metrics.rs'
          $text = Get-Content $path -Raw
          $old = '        // SAFETY: `AllocationSize` was initialized by the successful API call.`r`n        let allocation_size = unsafe { standard.AllocationSize.QuadPart };'
          if (-not $text.Contains($old)) { throw 'allocation size marker mismatch' }
          $new = '        let allocation_size = standard.AllocationSize;'
          Set-Content $path ($text.Replace($old, $new)) -NoNewline
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate build assets
        run: npm run build
      - name: Capture Rust test output
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml *> .github/windows-test-log.txt
          $exitCode = $LASTEXITCODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/file_metrics.rs .github/windows-test-log.txt
          git commit -m "fix: use native allocation size value"
          git push
          exit $exitCode
