name: Diagnose Windows handle snapshot

on:
  push:
    branches: [fix/phase4-handle-snapshot-toctou]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-handle-snapshot-toctou
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate build assets
        run: npm run build
      - name: Capture Rust test output
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml *> .github/windows-test-log.txt
          $exitCode = $LASTEXITCODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/windows-test-log.txt
          git commit -m "ci: capture Windows snapshot test output"
          git push
          exit $exitCode
