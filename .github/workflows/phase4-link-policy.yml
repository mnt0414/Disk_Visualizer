name: Phase 4 link policy

on:
  push:
    branches: [feat/filesystem-boundaries-core]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/filesystem-boundaries-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Implement non-followed links
        run: |
          python - <<'PY'
          from pathlib import Path

          metrics = Path('src-tauri/src/file_metrics.rs')
          text = metrics.read_text()
          marker = '#[cfg(unix)]\npub fn collect(_path: &Path, metadata: &Metadata) -> FileMetrics {'
          helper = '''pub fn is_non_followed_link(metadata: &Metadata) -> bool {
              if metadata.file_type().is_symlink() {
                  return true;
              }
              #[cfg(windows)]
              {
                  use std::os::windows::fs::MetadataExt;
                  use windows_sys::Win32::Storage::FileSystem::FILE_ATTRIBUTE_REPARSE_POINT;
                  return metadata.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0;
              }
              #[cfg(not(windows))]
              {
                  false
              }
          }

          #[cfg(unix)]
          pub fn collect(_path: &Path, metadata: &Metadata) -> FileMetrics {'''
          if text.count(marker) != 1:
              raise SystemExit('file metrics insertion marker mismatch')
          metrics.write_text(text.replace(marker, helper, 1))

          scanner = Path('src-tauri/src/scanner.rs')
          text = scanner.read_text()
          old = 'if metadata.file_type().is_symlink() {'
          new = 'if file_metrics::is_non_followed_link(&metadata) {'
          if text.count(old) != 1:
              raise SystemExit('scanner link condition marker mismatch')
          text = text.replace(old, new, 1)
          test_marker = '''    #[test]
              fn reports_per_file_metadata() {'''
          test = '''    #[cfg(unix)]
              #[test]
              fn does_not_follow_symbolic_links() {
                  use std::os::unix::fs::symlink;

                  let root = temporary_directory("symbolic-link");
                  let outside = temporary_directory("symbolic-link-target");
                  fs::write(outside.join("outside.bin"), [0_u8; 16]).unwrap();
                  symlink(&outside, root.join("linked-directory")).unwrap();
                  let summary = scan_folder_path(&root).unwrap();
                  assert_eq!(summary.total_size_bytes, 0);
                  assert_eq!(summary.file_count, 0);
                  assert_eq!(summary.skipped_count, 1);
                  fs::remove_dir_all(root).unwrap();
                  fs::remove_dir_all(outside).unwrap();
              }

              #[test]
              fn reports_per_file_metadata() {'''
          if text.count(test_marker) != 1:
              raise SystemExit('scanner test marker mismatch')
          scanner.write_text(text.replace(test_marker, test, 1))

          progress = Path('docs/PHASE4_PROGRESS.md')
          text = progress.read_text()
          old = '- [ ] シンボリックリンク／ジャンクション／リパースポイントの分類'
          new = '- [x] シンボリックリンク／ジャンクション／リパースポイントを非追跡で除外'
          if text.count(old) != 1:
              raise SystemExit('progress marker mismatch')
          progress.write_text(text.replace(old, new, 1))

          accuracy = Path('docs/FILESYSTEM_ACCURACY.md')
          text = accuracy.read_text()
          old = '- シンボリックリンク: 引き続き追跡せず、読み飛ばしとして計上'
          new = '''- シンボリックリンク: 追跡せず、読み飛ばしとして計上
          - Windowsジャンクション／リパースポイント: `FILE_ATTRIBUTE_REPARSE_POINT`で検出し、追跡しない'''
          if text.count(old) != 1:
              raise SystemExit('accuracy marker mismatch')
          accuracy.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/file_metrics.rs src-tauri/src/scanner.rs docs/PHASE4_PROGRESS.md docs/FILESYSTEM_ACCURACY.md
          git commit -m "feat: enforce non-followed link policy"
          git push
