name: Temporary isolated cache definition integration

on:
  push:
    branches: [feat/adobe-blender-cache-definitions]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adobe-blender-cache-definitions
      - name: Apply changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('src-tauri/definitions/cache-catalog-v1.json')
          data = json.loads(p.read_text())
          if data['catalogVersion'] != '2026.08.1':
              raise SystemExit('unexpected catalog version')
          data['catalogVersion'] = '2026.08.2'
          common = {
              'definitionVersion': 1,
              'versionConstraint': '*',
              'category': 'media',
              'confidence': 'high',
              'evidence': ['knownApplicationCachePath', 'platformSpecificPath'],
              'regenerable': True,
          }
          specs = [
              ('adobe.macos.media-cache-files', 'macos', 'Adobe Media Cache', 'home', 'Library/Application Support/Adobe/Common/Media Cache Files', 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower'),
              ('adobe.macos.media-cache-database', 'macos', 'Adobe Media Cache', 'home', 'Library/Application Support/Adobe/Common/Media Cache', 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower'),
              ('adobe.windows.media-cache-files', 'windows', 'Adobe Media Cache', 'roamingAppData', 'Adobe/Common/Media Cache Files', 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower'),
              ('adobe.windows.media-cache-database', 'windows', 'Adobe Media Cache', 'roamingAppData', 'Adobe/Common/Media Cache', 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower'),
              ('blender.macos.asset-library-cache', 'macos', 'Blender Asset Library Cache', 'systemCache', 'Library/Caches/Blender', 'assetLibraryCacheWillBeReindexed'),
              ('blender.windows.asset-library-cache', 'windows', 'Blender Asset Library Cache', 'localAppData', 'Blender Foundation/Blender/Cache', 'assetLibraryCacheWillBeReindexed'),
          ]
          for id_, platform, app, root, relative, impact in specs:
              definition = dict(common)
              definition.update({
                  'id': id_,
                  'platform': platform,
                  'applicationName': app,
                  'path': {'root': root, 'relativePath': relative, 'source': 'fixed'},
                  'cleanupImpact': impact,
              })
              data['definitions'].append(definition)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('src-tauri/src/cache_catalog.rs')
          text = p.read_text()
          old = '''        Platform::Macos => &[
            (CachePathRoot::Home, "HOME"),
            (CachePathRoot::SystemCache, "HOME"),
        ],'''
          if old not in text:
              raise SystemExit('mac roots marker missing')
          text = text.replace(old, '        Platform::Macos => &[(CachePathRoot::Home, "HOME")],')
          old = '''    variables
        .iter()
        .filter_map(|(root, variable)| {
            std::env::var_os(variable).map(|value| (*root, value.into()))
        })
        .collect()
}'''
          new = '''    let mut roots: Vec<_> = variables
        .iter()
        .filter_map(|(root, variable)| {
            std::env::var_os(variable).map(|value| (*root, value.into()))
        })
        .collect();
    if platform == Platform::Macos {
        roots.push((CachePathRoot::SystemCache, PathBuf::from("/")));
    }
    roots
}'''
          if old not in text:
              raise SystemExit('root collection marker missing')
          text = text.replace(old, new)
          text = text.replace('assert_eq!(catalog.catalog_version, "2026.08.1");', 'assert_eq!(catalog.catalog_version, "2026.08.2");')
          text = text.replace('assert!(catalog.definitions.len() >= 6);', 'assert!(catalog.definitions.len() >= 12);')
          marker = '''    #[test]
    fn rejects_root_prefix_collisions() {'''
          tests = '''    #[test]
    fn matches_adobe_media_cache_defaults() {
        let catalog = bundled_catalog().unwrap();
        assert_eq!(catalog.classify(Platform::Macos, CachePathRoot::Home, "Library/Application Support/Adobe/Common/Media Cache Files/peak.pek")[0].id, "adobe.macos.media-cache-files");
        assert_eq!(catalog.classify(Platform::Windows, CachePathRoot::RoamingAppData, "adobe/common/media cache/index.db")[0].id, "adobe.windows.media-cache-database");
    }

    #[test]
    fn matches_blender_asset_library_cache_defaults() {
        let catalog = bundled_catalog().unwrap();
        assert_eq!(catalog.classify(Platform::Macos, CachePathRoot::SystemCache, "Library/Caches/Blender/assets/index.db")[0].id, "blender.macos.asset-library-cache");
        assert_eq!(catalog.classify(Platform::Windows, CachePathRoot::LocalAppData, "Blender Foundation/Blender/Cache/assets/index.db")[0].id, "blender.windows.asset-library-cache");
    }

    #[test]
    fn rejects_root_prefix_collisions() {'''
          if marker not in text:
              raise SystemExit('test marker missing')
          p.write_text(text.replace(marker, tests))

          p = Path('src/features/AppCacheView.tsx')
          text = p.read_text()
          marker = '''  browserMayRebuildCacheAndLoadSlower:
    '次回起動後に再生成され、一時的に読み込みが遅くなる場合があります',
}'''
          replacement = '''  browserMayRebuildCacheAndLoadSlower:
    '次回起動後に再生成され、一時的に読み込みが遅くなる場合があります',
  mediaCacheWillBeRecreatedAndPlaybackMayBeSlower:
    '必要に応じて再生成され、次回の読み込みや再生が一時的に遅くなる場合があります',
  assetLibraryCacheWillBeReindexed:
    'アセットライブラリの索引が再作成され、次回の検索に時間がかかる場合があります',
}'''
          if marker not in text:
              raise SystemExit('impact marker missing')
          p.write_text(text.replace(marker, replacement))
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/AppCacheView.tsx src-tauri/definitions/cache-catalog-v1.json src-tauri/src/cache_catalog.rs
          git commit -m "feat: add verified Adobe and Blender cache definitions"
          git push origin HEAD:feat/adobe-blender-cache-definitions
