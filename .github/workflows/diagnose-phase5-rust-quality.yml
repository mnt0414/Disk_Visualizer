name: Diagnose Phase 5 Rust quality

on:
  push:
    branches: [feat/phase5-cache-catalog-domain]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase5-cache-catalog-domain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Capture Rust quality output
        shell: bash
        run: |
          set +e
          {
            echo '=== cargo fmt ==='
            cargo fmt --check --manifest-path src-tauri/Cargo.toml
            echo '=== cargo clippy ==='
            cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
            echo '=== cargo test ==='
            cargo test --manifest-path src-tauri/Cargo.toml
          } > .github/phase5-rust-quality.log 2>&1
          status=$?
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/phase5-rust-quality.log
          git commit -m "ci: capture Phase 5 Rust quality output"
          git push
          exit $status
