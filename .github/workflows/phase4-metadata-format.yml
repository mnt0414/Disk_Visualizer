name: Phase 4 metadata formatter

on:
  push:
    branches: [feat/persist-filesystem-metadata]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persist-filesystem-metadata
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatted Rust
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format filesystem metadata persistence"
          git push
