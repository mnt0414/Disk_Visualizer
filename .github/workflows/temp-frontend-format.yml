name: Temporary frontend formatter

on:
  push:
    branches: [feat/cache-view-live-data]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-view-live-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Format changed frontend files
        run: ./node_modules/.bin/prettier --write src/types/scan.ts src/services/scan.ts src/features/AppCacheView.tsx src/features/MockView.tsx src/features/MockView.test.tsx src/features/mock-views.css
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format app cache view"
          git push origin HEAD:feat/cache-view-live-data
