name: Temporary checkpoint integration patch

on:
  push:
    branches: [feat/atomic-full-scan-checkpoint]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atomic-full-scan-checkpoint
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply integration patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              file.write_text(text.replace(old, new))

          replace(
              "src-tauri/src/index_checkpoint.rs",
              "use std::path::PathBuf;",
              "use std::path::{Path, PathBuf};",
          )
          replace(
              "src-tauri/src/index_checkpoint.rs",
              "impl IndexCheckpointRepository {",
              '''pub(crate) fn validate_checkpoint(checkpoint: &IndexCheckpoint) -> Result<(), String> {
              if checkpoint.root_path.is_empty()
                  || checkpoint.volume_identity.is_empty()
                  || checkpoint.root_identity.is_empty()
                  || checkpoint.history_token.is_empty()
              {
                  return Err("差分更新checkpointのidentityまたはtokenが不足しています".to_owned());
              }
              Ok(())
          }

          pub(crate) fn upsert_checkpoint(
              connection: &Connection,
              checkpoint: &IndexCheckpoint,
          ) -> Result<(), String> {
              validate_checkpoint(checkpoint)?;
              connection.execute("INSERT INTO index_checkpoints (root_path,platform,volume_identity,root_identity,history_source,history_token,updated_at) VALUES (?1,?2,?3,?4,?5,?6,?7) ON CONFLICT(root_path) DO UPDATE SET platform=excluded.platform,volume_identity=excluded.volume_identity,root_identity=excluded.root_identity,history_source=excluded.history_source,history_token=excluded.history_token,updated_at=excluded.updated_at",params![checkpoint.root_path,checkpoint.platform,checkpoint.volume_identity,checkpoint.root_identity,checkpoint.history_source,checkpoint.history_token,checkpoint.updated_at]).map_err(|error|format!("差分更新checkpointを保存できません: {error}"))?;
              Ok(())
          }

          pub fn capture_full_scan_checkpoint(root: &Path) -> Result<Option<IndexCheckpoint>, String> {
              #[cfg(target_os = "macos")]
              {
                  use cap_std::{ambient_authority, fs::Dir};
                  use std::os::unix::fs::MetadataExt;

                  if !root.is_absolute() {
                      return Err("checkpoint取得には絶対pathが必要です".to_owned());
                  }
                  let canonical_root = root
                      .canonicalize()
                      .map_err(|error| format!("checkpoint対象を解決できません: {error}"))?;
                  if !canonical_root.is_dir() {
                      return Err("checkpoint対象はdirectoryである必要があります".to_owned());
                  }
                  let directory = Dir::open_ambient_dir(&canonical_root, ambient_authority())
                      .map_err(|error| format!("checkpoint対象を安全に開けません: {error}"))?;
                  let metadata = directory
                      .into_std_file()
                      .metadata()
                      .map_err(|error| format!("checkpoint対象のidentityを取得できません: {error}"))?;
                  let history_token = crate::macos_fsevents::query_checkpoint(&canonical_root)?.encode();
                  Ok(Some(IndexCheckpoint {
                      root_path: canonical_root.to_string_lossy().into_owned(),
                      platform: "macos".to_owned(),
                      volume_identity: metadata.dev().to_string(),
                      root_identity: metadata.ino().to_string(),
                      history_source: "fsevents".to_owned(),
                      history_token,
                      updated_at: unix_time()?,
                  }))
              }
              #[cfg(not(target_os = "macos"))]
              {
                  let _ = root;
                  Ok(None)
              }
          }

          impl IndexCheckpointRepository {''',
          )
          replace(
              "src-tauri/src/index_checkpoint.rs",
              '''    pub fn save(&self, checkpoint: &IndexCheckpoint) -> Result<(), String> {
                  if checkpoint.root_path.is_empty()
                      || checkpoint.volume_identity.is_empty()
                      || checkpoint.root_identity.is_empty()
                      || checkpoint.history_token.is_empty()
                  {
                      return Err("差分更新checkpointのidentityまたはtokenが不足しています".to_owned());
                  }
                  self.connection()?.execute("INSERT INTO index_checkpoints (root_path,platform,volume_identity,root_identity,history_source,history_token,updated_at) VALUES (?1,?2,?3,?4,?5,?6,?7) ON CONFLICT(root_path) DO UPDATE SET platform=excluded.platform,volume_identity=excluded.volume_identity,root_identity=excluded.root_identity,history_source=excluded.history_source,history_token=excluded.history_token,updated_at=excluded.updated_at",params![checkpoint.root_path,checkpoint.platform,checkpoint.volume_identity,checkpoint.root_identity,checkpoint.history_source,checkpoint.history_token,checkpoint.updated_at]).map_err(|error|format!("差分更新checkpointを保存できません: {error}"))?;
                  Ok(())
              }''',
              '''    pub fn save(&self, checkpoint: &IndexCheckpoint) -> Result<(), String> {
                  upsert_checkpoint(&self.connection()?, checkpoint)
              }''',
          )

          replace(
              "src-tauri/src/storage.rs",
              "use crate::cache_catalog::{self, CacheClassificationRef};",
              "use crate::cache_catalog::{self, CacheClassificationRef};\nuse crate::index_checkpoint::{upsert_checkpoint, IndexCheckpoint};",
          )
          replace(
              "src-tauri/src/storage.rs",
              '''    fn finish_stream(&self, scan_id: i64, summary: &ScanSummary) -> Result<(), String> {
                  self.connection()?.execute("UPDATE scan_sessions SET status='complete',total_size_bytes=?2,file_count=?3,directory_count=?4,skipped_count=?5,elapsed_milliseconds=?6,completed_at=?7 WHERE id=?1 AND status='in_progress'",params![scan_id,to_i64(summary.total_size_bytes,"合計サイズ")?,to_i64(summary.file_count,"ファイル数")?,to_i64(summary.directory_count,"フォルダ数")?,to_i64(summary.skipped_count,"読み飛ばし数")?,elapsed_to_i64(summary.elapsed_milliseconds)?,unix_time()?]).map_err(|e|format!("スキャン履歴を確定できません: {e}"))?;
                  Ok(())
              }''',
              '''    fn finish_stream(
                  &self,
                  scan_id: i64,
                  summary: &ScanSummary,
                  checkpoint: Option<&IndexCheckpoint>,
              ) -> Result<(), String> {
                  let mut connection = self.connection()?;
                  let transaction = connection.transaction().map_err(|e| e.to_string())?;
                  let changed = transaction.execute("UPDATE scan_sessions SET status='complete',total_size_bytes=?2,file_count=?3,directory_count=?4,skipped_count=?5,elapsed_milliseconds=?6,completed_at=?7 WHERE id=?1 AND status='in_progress'",params![scan_id,to_i64(summary.total_size_bytes,"合計サイズ")?,to_i64(summary.file_count,"ファイル数")?,to_i64(summary.directory_count,"フォルダ数")?,to_i64(summary.skipped_count,"読み飛ばし数")?,elapsed_to_i64(summary.elapsed_milliseconds)?,unix_time()?]).map_err(|e|format!("スキャン履歴を確定できません: {e}"))?;
                  if changed != 1 {
                      return Err("実行中のスキャン履歴を確定できません".to_owned());
                  }
                  if let Some(checkpoint) = checkpoint {
                      upsert_checkpoint(&transaction, checkpoint)?;
                  }
                  transaction.commit().map_err(|e| format!("スキャン結果とcheckpointを確定できません: {e}"))
              }''',
          )
          replace(
              "src-tauri/src/storage.rs",
              '''    pub fn complete(&self, summary: &ScanSummary) -> Result<(), String> {
                  self.flush();
                  if let Some(error) = self.error.lock().unwrap_or_else(|e| e.into_inner()).clone() {
                      self.repository.stop_stream(self.scan_id, "failed")?;
                      return Err(error);
                  }
                  self.repository.finish_stream(self.scan_id, summary)
              }''',
              '''    pub fn complete(&self, summary: &ScanSummary) -> Result<(), String> {
                  self.complete_with_checkpoint(summary, None)
              }
              pub fn complete_with_checkpoint(
                  &self,
                  summary: &ScanSummary,
                  checkpoint: Option<&IndexCheckpoint>,
              ) -> Result<(), String> {
                  self.flush();
                  if let Some(error) = self.error.lock().unwrap_or_else(|e| e.into_inner()).clone() {
                      self.repository.stop_stream(self.scan_id, "failed")?;
                      return Err(error);
                  }
                  if let Err(error) = self.repository.finish_stream(self.scan_id, summary, checkpoint) {
                      let _ = self.repository.stop_stream(self.scan_id, "failed");
                      return Err(error);
                  }
                  Ok(())
              }''',
          )
          replace(
              "src-tauri/src/storage.rs",
              '''    #[test]
              fn persists_filesystem_metadata() {''',
              '''    #[test]
              fn atomically_completes_scan_and_saves_checkpoint() {
                  let repository = repository("atomic-checkpoint");
                  let checkpoint_repository = crate::index_checkpoint::IndexCheckpointRepository::new(
                      repository.path().to_path_buf(),
                  );
                  checkpoint_repository.initialize().unwrap();
                  let writer = repository.begin_stream("/tmp/sample").unwrap();
                  writer.record(&progress(PathBuf::from("/tmp/sample/file.bin")));
                  let checkpoint = IndexCheckpoint {
                      root_path: "/tmp/sample".to_owned(),
                      platform: "macos".to_owned(),
                      volume_identity: "7".to_owned(),
                      root_identity: "42".to_owned(),
                      history_source: "fsevents".to_owned(),
                      history_token: "fsevents:v1:10".to_owned(),
                      updated_at: 1234,
                  };
                  writer
                      .complete_with_checkpoint(&summary(1), Some(&checkpoint))
                      .unwrap();
                  assert_eq!(
                      checkpoint_repository.load("/tmp/sample").unwrap(),
                      Some(checkpoint)
                  );
                  assert_eq!(repository.list().unwrap().len(), 1);
                  let _ = std::fs::remove_file(repository.path());
              }
              #[test]
              fn rolls_back_completion_when_checkpoint_is_invalid() {
                  let repository = repository("checkpoint-rollback");
                  let checkpoint_repository = crate::index_checkpoint::IndexCheckpointRepository::new(
                      repository.path().to_path_buf(),
                  );
                  checkpoint_repository.initialize().unwrap();
                  let writer = repository.begin_stream("/tmp/sample").unwrap();
                  let mut checkpoint = IndexCheckpoint {
                      root_path: "/tmp/sample".to_owned(),
                      platform: "macos".to_owned(),
                      volume_identity: "7".to_owned(),
                      root_identity: "42".to_owned(),
                      history_source: "fsevents".to_owned(),
                      history_token: String::new(),
                      updated_at: 1234,
                  };
                  assert!(writer
                      .complete_with_checkpoint(&summary(0), Some(&checkpoint))
                      .is_err());
                  let status: String = repository
                      .connection()
                      .unwrap()
                      .query_row("SELECT status FROM scan_sessions LIMIT 1", [], |row| row.get(0))
                      .unwrap();
                  assert_eq!(status, "failed");
                  assert!(checkpoint_repository.load("/tmp/sample").unwrap().is_none());
                  checkpoint.history_token = "fsevents:v1:10".to_owned();
                  assert!(checkpoint_repository.save(&checkpoint).is_ok());
                  let _ = std::fs::remove_file(repository.path());
              }
              #[test]
              fn persists_filesystem_metadata() {''',
          )

          replace(
              "src-tauri/src/scan_jobs.rs",
              "use crate::scanner::{self, ScanProgress, ScanSummary};",
              "use crate::index_checkpoint::capture_full_scan_checkpoint;\nuse crate::scanner::{self, ScanProgress, ScanSummary};",
          )
          replace(
              "src-tauri/src/scan_jobs.rs",
              '''        let stream = self.repository.begin_stream(&path)?;''',
              '''        let checkpoint = capture_full_scan_checkpoint(Path::new(&path))
                  .ok()
                  .flatten();
              let stream = self.repository.begin_stream(&path)?;''',
          )
          replace(
              "src-tauri/src/scan_jobs.rs",
              "let persisted = stream.complete(&summary);",
              "let persisted = stream.complete_with_checkpoint(&summary, checkpoint.as_ref());",
          )

          replace(
              "docs/PHASE6_PROGRESS.md",
              "1. 完了したフルスキャンと同じtransaction境界でvolume／root identityとOS履歴checkpointを確定する",
              "1. 信頼できる変更pathだけを部分再走査し、`RescanSubtrees`はsubtree単位へ拡張する",
          )
          replace(
              "docs/PHASE6_PROGRESS.md",
              "2. 信頼できる変更pathだけを部分再走査し、`RescanSubtrees`はsubtree単位へ拡張する\n3. Windows USN変更record読取adapterを追加する\n4. 信頼状態をUIへ表示し、差分不可時は理由付きでフルスキャンを提案する\n5. 外付け媒体の切断・再接続、スリープ復帰でidentityを再評価する",
              "2. Windows USN変更record読取adapterを追加する\n3. 信頼状態をUIへ表示し、差分不可時は理由付きでフルスキャンを提案する\n4. 外付け媒体の切断・再接続、スリープ復帰でidentityを再評価する",
          )
          replace(
              "docs/PHASE6_PROGRESS.md",
              "## 次の実装",
              '''## フルスキャンcheckpointの原子的確定

          macOSではフルスキャン開始前にFSEvents checkpointとdirectory handle由来のvolume／root identityを取得する。開始前の位置を使うことで、走査中に発生した変更は次回の履歴読取で再取得され、取りこぼしを避ける。

          - scan sessionの`complete`更新と`index_checkpoints`のupsertを同じSQLite transactionで確定する
          - checkpoint検証・保存に失敗した場合はtransactionをrollbackし、sessionを`failed`へ遷移する
          - キャンセル、走査失敗、永続化失敗ではcheckpointを保存しない
          - FSEvents checkpointを取得できない環境ではフルスキャン自体を妨げず、推測したtokenは保存しない

          ## 次の実装''',
          )
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri docs/PHASE6_PROGRESS.md
          git commit -m "feat: atomically persist full scan checkpoint"
          git push
