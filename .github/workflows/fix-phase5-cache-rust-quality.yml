name: Fix Phase 5 Rust formatting

on:
  push:
    branches: [feat/phase5-persist-cache-classification]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase5-persist-cache-classification
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/cache_catalog.rs src-tauri/src/storage.rs
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format cache persistence sources"
            git push
          fi
