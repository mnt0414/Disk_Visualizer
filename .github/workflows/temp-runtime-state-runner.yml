name: Temporary runtime state runner

on:
  push:
    branches: [feat/cache-runtime-state-storage]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-runtime-state-storage
      - name: Apply integration patch
        run: python scripts/apply-runtime-state-temp.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/cache_activity.rs src-tauri/src/storage.rs src-tauri/src/cache_query.rs docs/SQLITE_SCHEMA_V6.md
          git commit -m "feat: persist cache runtime state"
          git push origin HEAD:feat/cache-runtime-state-storage
