name: Temporary format Windows USN adapter
on:
  push:
    branches: [feat/windows-usn-adapter]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-usn-adapter
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/windows_usn.rs
          git commit -m "style: format Windows USN adapter"
          git push origin HEAD:feat/windows-usn-adapter
