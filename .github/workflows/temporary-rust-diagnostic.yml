name: Temporary Rust diagnostic

on:
  push:
    branches: [feat/atomic-full-scan-checkpoint]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atomic-full-scan-checkpoint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --check --manifest-path src-tauri/Cargo.toml > docs/CI_DIAGNOSTIC.txt 2>&1
          echo "fmt_exit=$?" >> docs/CI_DIAGNOSTIC.txt
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings >> docs/CI_DIAGNOSTIC.txt 2>&1
          echo "clippy_exit=$?" >> docs/CI_DIAGNOSTIC.txt
          cargo test --manifest-path src-tauri/Cargo.toml >> docs/CI_DIAGNOSTIC.txt 2>&1
          echo "test_exit=$?" >> docs/CI_DIAGNOSTIC.txt
          tail -n 200 docs/CI_DIAGNOSTIC.txt > docs/CI_DIAGNOSTIC.tail
          mv docs/CI_DIAGNOSTIC.tail docs/CI_DIAGNOSTIC.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_DIAGNOSTIC.txt
          git commit -m "ci: capture Rust diagnostic"
          git push
