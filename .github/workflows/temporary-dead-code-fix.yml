name: Temporary dead-code fix
on:
  push:
    branches: [feat/atomic-full-scan-checkpoint]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atomic-full-scan-checkpoint
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/storage.rs')
          text = path.read_text()
          old = '    pub fn complete(&self, summary: &ScanSummary) -> Result<(), String> {\n        self.complete_with_checkpoint(summary, None)\n    }'
          new = '    #[cfg(test)]\n    pub fn complete(&self, summary: &ScanSummary) -> Result<(), String> {\n        self.complete_with_checkpoint(summary, None)\n    }'
          if text.count(old) != 1:
              raise SystemExit('complete method pattern mismatch')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/storage.rs
          git commit -m "fix: limit legacy completion helper to tests"
          git push
