name: Temporary export index trust module
on:
  push:
    branches: [feat/index-trust-model]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/index-trust-model
      - run: sed -i 's/^mod index_trust;/pub mod index_trust;/' src-tauri/src/lib.rs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git commit -m "fix: expose index trust domain model"
          git push origin HEAD:feat/index-trust-model
