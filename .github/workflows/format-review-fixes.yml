name: Format review fixes
on:
  push:
    branches: [fix/review-findings-phase3]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: apply canonical formatting') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-findings-phase3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm install
      - run: npm run format
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: apply canonical formatting"
          git push
