name: Temporary runtime state runner diagnostics

on:
  push:
    branches: [feat/cache-runtime-state-storage]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-runtime-state-storage
      - name: Capture runner result
        run: |
          set +e
          python scripts/apply-runtime-state-temp.py > runtime-state-runner-diagnostics.txt 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            cargo fmt --manifest-path src-tauri/Cargo.toml >> runtime-state-runner-diagnostics.txt 2>&1
            STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            cargo test --manifest-path src-tauri/Cargo.toml >> runtime-state-runner-diagnostics.txt 2>&1
            STATUS=$?
          fi
          echo "status=$STATUS" >> runtime-state-runner-diagnostics.txt
          git diff --stat >> runtime-state-runner-diagnostics.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runtime-state-runner-diagnostics.txt
          git commit -m "ci: capture runtime state runner diagnostics"
          git push origin HEAD:feat/cache-runtime-state-storage
