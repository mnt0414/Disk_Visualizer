name: Temporary format FSEvents batch evaluator
on:
  push:
    branches: [feat/fsevents-batch-evaluation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fsevents-batch-evaluation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/macos_fsevents.rs
          git commit -m "style: format FSEvents batch evaluator"
          git push origin HEAD:feat/fsevents-batch-evaluation
