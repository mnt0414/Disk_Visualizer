name: Temporary runtime state diagnostics

on:
  push:
    branches: [feat/cache-runtime-state-storage]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-runtime-state-storage
      - name: Extract patched integration script
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/temp-runtime-state-integration.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          script = script.replace('if actual != expected:', 'if actual < expected:')
          script = script.replace('return text.replace(old, new)', 'return text.replace(old, new, expected)')
          parameter_start = script.index("text = replace(text, '''                        entry\n")
          parameter_end = script.index("text = replace(text, 'impl StreamingScanWriter", parameter_start)
          parameter_patch = '''text = replace(text, "                            .map(|value| i64::from(value.definition_version)),\\n", """                            .map(|value| i64::from(value.definition_version)),
                        entry
                            .cache_runtime_state
                            .as_ref()
                            .map(CacheRuntimeState::as_str),
""")
'''
          script = script[:parameter_start] + parameter_patch + script[parameter_end:]
          Path('/tmp/runtime-state-apply.py').write_text(script)
          PY
      - name: Apply, format, and test
        run: |
          set +e
          python /tmp/runtime-state-apply.py > runtime-state-diagnostics.txt 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            cargo fmt --manifest-path src-tauri/Cargo.toml >> runtime-state-diagnostics.txt 2>&1
            STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            cargo test --manifest-path src-tauri/Cargo.toml >> runtime-state-diagnostics.txt 2>&1
            STATUS=$?
          fi
          echo "status=$STATUS" >> runtime-state-diagnostics.txt
          git diff --stat >> runtime-state-diagnostics.txt
          echo "$STATUS" > /tmp/runtime-state-status
          exit 0
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(cat /tmp/runtime-state-status)" -eq 0 ]; then
            git add src-tauri/src/cache_activity.rs src-tauri/src/storage.rs src-tauri/src/cache_query.rs docs/SQLITE_SCHEMA_V6.md
            git commit -m "feat: persist cache runtime state"
          else
            git add -f runtime-state-diagnostics.txt
            git commit -m "ci: update runtime state diagnostics"
          fi
          git push origin HEAD:feat/cache-runtime-state-storage
