name: Temporary runtime state diagnostics

on:
  push:
    branches: [feat/cache-runtime-state-storage]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-runtime-state-storage
      - name: Extract and run integration script
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/temp-runtime-state-integration.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          Path('/tmp/runtime-state-apply.py').write_text(script)
          PY
          set +e
          python /tmp/runtime-state-apply.py > runtime-state-diagnostics.txt 2>&1
          STATUS=$?
          echo "status=$STATUS" >> runtime-state-diagnostics.txt
          git diff --stat >> runtime-state-diagnostics.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runtime-state-diagnostics.txt
          git commit -m "ci: capture runtime state diagnostics"
          git push origin HEAD:feat/cache-runtime-state-storage
