name: Temporary FSEvents formatter and lockfile

on:
  push:
    branches: [feat/fsevents-history-stream]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fsevents-history-stream
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock src-tauri/src/fsevents_history.rs src-tauri/src/lib.rs
          git commit -m "chore: format and lock FSEvents history adapter"
          git push
