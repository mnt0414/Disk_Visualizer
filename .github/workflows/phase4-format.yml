name: Apply Phase 4 formatting
on:
  push:
    branches: [feat/filesystem-accuracy]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/filesystem-accuracy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Complete dependent model fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/storage.rs')
          text = path.read_text()
          old = '''            total_size_bytes: files * 1024,
            file_count: files,'''
          new = '''            total_size_bytes: files * 1024,
            allocated_size_bytes: files * 4096,
            file_count: files,
            hard_link_duplicate_count: 0,
            sparse_file_count: 0,
            compressed_file_count: 0,'''
          if old not in text:
              raise SystemExit('storage summary initializer not found')
          path.write_text(text.replace(old, new))
          PY
      - run: npm install
      - run: npm run format
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src src-tauri docs package-lock.json
          git commit -m "style: format Phase 4 accuracy changes"
          git push