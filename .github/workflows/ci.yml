name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  boundary-implementation:
    if: github.head_ref == 'feat/link-and-volume-boundaries' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/link-and-volume-boundaries
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation script
        run: |
          set +e
          {
            sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/phase4-boundary-implementation.yml | sed '1d;$d;s/^          //' > /tmp/implement-boundaries.py
            test -s /tmp/implement-boundaries.py
            python /tmp/implement-boundaries.py
            cargo fmt --manifest-path src-tauri/Cargo.toml
          } > boundary-implementation.log 2>&1
          echo $? > /tmp/boundary-status
          exit 0
      - name: Commit implementation or diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$(cat /tmp/boundary-status)" -ne 0 ]; then
            git add -f boundary-implementation.log
            git commit -m "ci: capture boundary implementation failure"
            git push
            exit 0
          fi
          rm boundary-implementation.log
          git add src-tauri/src/file_metrics.rs src-tauri/src/scanner.rs src-tauri/src/storage.rs docs/PHASE4_PROGRESS.md docs/FILESYSTEM_ACCURACY.md
          git commit -m "feat: enforce link and volume boundaries"
          git push

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 10
        env:
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
          NPM_CONFIG_FETCH_TIMEOUT: 300000
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 10
        env:
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
          NPM_CONFIG_FETCH_TIMEOUT: 300000
      - run: npm run build
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 10
        env:
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
          NPM_CONFIG_FETCH_TIMEOUT: 300000
      - run: npm run tauri build -- --debug --target ${{ matrix.target }}
