name: Temporary format index trust model
on:
  push:
    branches: [feat/index-trust-model]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/index-trust-model
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/index_trust.rs src-tauri/src/lib.rs
          git diff --cached --quiet || git commit -m "style: format index trust model"
          git push origin HEAD:feat/index-trust-model
