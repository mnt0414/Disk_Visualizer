name: Temporary ECC diagnostics

on:
  push:
    branches: [fix/ecc-review-findings]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecc-review-findings
      - name: Skip after diagnostics exist
        id: guard
        run: |
          if [ -f docs/ecc-diagnostics.txt ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.skip != 'true'
        with:
          components: rustfmt
      - name: Capture diagnostics
        if: steps.guard.outputs.skip != 'true'
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund > docs/ecc-diagnostics.txt 2>&1
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml >> docs/ecc-diagnostics.txt 2>&1
          cargo fmt --manifest-path src-tauri/Cargo.toml >> docs/ecc-diagnostics.txt 2>&1
          cargo test --manifest-path src-tauri/Cargo.toml >> docs/ecc-diagnostics.txt 2>&1
          echo "exit=$?" >> docs/ecc-diagnostics.txt
      - name: Commit diagnostics and generated files
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ecc-diagnostics.txt package-lock.json src-tauri/Cargo.lock src-tauri/src/scanner.rs src-tauri/src/file_metrics.rs
          git commit -m "ci: capture ECC repair diagnostics"
          git push origin HEAD:fix/ecc-review-findings
