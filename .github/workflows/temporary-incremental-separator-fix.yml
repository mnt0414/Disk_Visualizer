name: Temporary incremental separator fix
on:
  push:
    branches: [feat/atomic-incremental-storage]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/atomic-incremental-storage
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/incremental_storage.rs')
          text = path.read_text().replace('PathBuf::from(relative).to_string_lossy().as_ref()', 'absolute.strip_prefix(root).unwrap().to_string_lossy().as_ref()')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/incremental_storage.rs
          git commit -m "test: use native relative path separators"
          git push
