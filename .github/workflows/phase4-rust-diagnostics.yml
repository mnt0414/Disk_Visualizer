name: Phase 4 Rust diagnostics

on:
  push:
    branches: [feat/persist-filesystem-metadata]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persist-filesystem-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Capture Rust quality output
        run: |
          set +e
          {
            echo '=== cargo fmt --check ==='
            cargo fmt --check --manifest-path src-tauri/Cargo.toml
            echo "fmt_status=$?"
            echo '=== cargo clippy ==='
            cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
            echo "clippy_status=$?"
            echo '=== cargo test ==='
            cargo test --manifest-path src-tauri/Cargo.toml
            echo "test_status=$?"
          } > rust-quality.log 2>&1
      - name: Commit diagnostic log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f rust-quality.log
          git commit -m "ci: capture Rust quality output"
          git push
