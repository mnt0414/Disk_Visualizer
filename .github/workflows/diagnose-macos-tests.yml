name: Diagnose macOS tests

on:
  push:
    branches: [fix/phase4-windows-volume-tests]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-windows-volume-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Capture macOS sequence output
        shell: bash
        run: |
          set +e
          : > macos-sequence.log
          cargo test --manifest-path src-tauri/Cargo.toml >> macos-sequence.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm run tauri build -- --debug --target aarch64-apple-darwin >> macos-sequence.log 2>&1
            status=$?
          fi
          cat macos-sequence.log
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f macos-sequence.log
            git commit -m "ci: capture macOS sequence failure"
            git push
          fi
          exit 0
