name: Temporary cache definition integration

on:
  push:
    branches: [feat/adobe-blender-cache-definitions]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adobe-blender-cache-definitions
      - name: Apply catalog and tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('src-tauri/definitions/cache-catalog-v1.json')
          catalog = json.loads(catalog_path.read_text())
          catalog['catalogVersion'] = '2026.08.2'
          catalog['definitions'].extend([
            {
              'id': 'adobe.macos.media-cache-files',
              'definitionVersion': 1,
              'platform': 'macos',
              'applicationName': 'Adobe Media Cache',
              'versionConstraint': '*',
              'category': 'media',
              'path': {'root': 'home', 'relativePath': 'Library/Application Support/Adobe/Common/Media Cache Files', 'source': 'fixed'},
              'confidence': 'high',
              'evidence': ['knownApplicationCachePath', 'platformSpecificPath'],
              'regenerable': True,
              'cleanupImpact': 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower',
            },
            {
              'id': 'adobe.macos.media-cache-database',
              'definitionVersion': 1,
              'platform': 'macos',
              'applicationName': 'Adobe Media Cache',
              'versionConstraint': '*',
              'category': 'media',
              'path': {'root': 'home', 'relativePath': 'Library/Application Support/Adobe/Common/Media Cache', 'source': 'fixed'},
              'confidence': 'high',
              'evidence': ['knownApplicationCachePath', 'platformSpecificPath'],
              'regenerable': True,
              'cleanupImpact': 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower',
            },
            {
              'id': 'adobe.windows.media-cache-files',
              'definitionVersion': 1,
              'platform': 'windows',
              'applicationName': 'Adobe Media Cache',
              'versionConstraint': '*',
              'category': 'media',
              'path': {'root': 'roamingAppData', 'relativePath': 'Adobe/Common/Media Cache Files', 'source': 'fixed'},
              'confidence': 'high',
              'evidence': ['knownApplicationCachePath', 'platformSpecificPath'],
              'regenerable': True,
              'cleanupImpact': 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower',
            },
            {
              'id': 'adobe.windows.media-cache-database',
              'definitionVersion': 1,
              'platform': 'windows',
              'applicationName': 'Adobe Media Cache',
              'versionConstraint': '*',
              'category': 'media',
              'path': {'root': 'roamingAppData', 'relativePath': 'Adobe/Common/Media Cache', 'source': 'fixed'},
              'confidence': 'high',
              'evidence': ['knownApplicationCachePath', 'platformSpecificPath'],
              'regenerable': True,
              'cleanupImpact': 'mediaCacheWillBeRecreatedAndPlaybackMayBeSlower',
            },
            {
              'id': 'blender.macos.asset-library-cache',
              'definitionVersion': 1,
              'platform': 'macos',
              'applicationName': 'Blender Asset Library Cache',
              'versionConstraint': '*',
              'category': 'media',
              'path': {'root': 'systemCache', 'relativePath': 'Library/Caches/Blender', 'source': 'fixed'},
              'confidence': 'high',
              'evidence': ['knownApplicationCachePath', 'platformSpecificPath'],
              'regenerable': True,
              'cleanupImpact': 'assetLibraryCacheWillBeReindexed',
            },
            {
              'id': 'blender.windows.asset-library-cache',
              'definitionVersion': 1,
              'platform': 'windows',
              'applicationName': 'Blender Asset Library Cache',
              'versionConstraint': '*',
              'category': 'media',
              'path': {'root': 'localAppData', 'relativePath': 'Blender Foundation/Blender/Cache', 'source': 'fixed'},
              'confidence': 'high',
              'evidence': ['knownApplicationCachePath', 'platformSpecificPath'],
              'regenerable': True,
              'cleanupImpact': 'assetLibraryCacheWillBeReindexed',
            },
          ])
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n')

          rust_path = Path('src-tauri/src/cache_catalog.rs')
          rust = rust_path.read_text()
          rust = rust.replace(
              '''        Platform::Macos => &[
            (CachePathRoot::Home, "HOME"),
            (CachePathRoot::SystemCache, "HOME"),
        ],''',
              '''        Platform::Macos => &[(CachePathRoot::Home, "HOME")],''',
          )
          old_collect = '''    variables
        .iter()
        .filter_map(|(root, variable)| {
            std::env::var_os(variable).map(|value| (*root, value.into()))
        })
        .collect()
}'''
          new_collect = '''    let mut roots: Vec<_> = variables
        .iter()
        .filter_map(|(root, variable)| {
            std::env::var_os(variable).map(|value| (*root, value.into()))
        })
        .collect();
    if platform == Platform::Macos {
        roots.push((CachePathRoot::SystemCache, PathBuf::from("/")));
    }
    roots
}'''
          if old_collect not in rust:
              raise SystemExit('configured roots block not found')
          rust = rust.replace(old_collect, new_collect)
          rust = rust.replace(
              'assert_eq!(catalog.catalog_version, "2026.08.1");',
              'assert_eq!(catalog.catalog_version, "2026.08.2");',
          )
          rust = rust.replace(
              'assert!(catalog.definitions.len() >= 6);',
              'assert!(catalog.definitions.len() >= 12);',
          )
          marker = '''    #[test]
    fn rejects_root_prefix_collisions() {'''
          tests = '''    #[test]
    fn matches_adobe_media_cache_defaults() {
        let catalog = bundled_catalog().unwrap();
        assert_eq!(
            catalog
                .classify(
                    Platform::Macos,
                    CachePathRoot::Home,
                    "Library/Application Support/Adobe/Common/Media Cache Files/peak.pek",
                )[0]
                .id,
            "adobe.macos.media-cache-files"
        );
        assert_eq!(
            catalog
                .classify(
                    Platform::Windows,
                    CachePathRoot::RoamingAppData,
                    "adobe/common/media cache/index.db",
                )[0]
                .id,
            "adobe.windows.media-cache-database"
        );
    }

    #[test]
    fn matches_blender_asset_library_cache_defaults() {
        let catalog = bundled_catalog().unwrap();
        assert_eq!(
            catalog
                .classify(
                    Platform::Macos,
                    CachePathRoot::SystemCache,
                    "Library/Caches/Blender/assets/index.db",
                )[0]
                .id,
            "blender.macos.asset-library-cache"
        );
        assert_eq!(
            catalog
                .classify(
                    Platform::Windows,
                    CachePathRoot::LocalAppData,
                    "Blender Foundation/Blender/Cache/assets/index.db",
                )[0]
                .id,
            "blender.windows.asset-library-cache"
        );
    }

    #[test]
    fn rejects_root_prefix_collisions() {'''
          if marker not in rust:
              raise SystemExit('test insertion point not found')
          rust_path.write_text(rust.replace(marker, tests))

          view_path = Path('src/features/AppCacheView.tsx')
          view = view_path.read_text()
          marker = '''  browserMayRebuildCacheAndLoadSlower:
    '次回起動後に再生成され、一時的に読み込みが遅くなる場合があります',
}'''
          replacement = '''  browserMayRebuildCacheAndLoadSlower:
    '次回起動後に再生成され、一時的に読み込みが遅くなる場合があります',
  mediaCacheWillBeRecreatedAndPlaybackMayBeSlower:
    '必要に応じて再生成され、次回の読み込みや再生が一時的に遅くなる場合があります',
  assetLibraryCacheWillBeReindexed:
    'アセットライブラリの索引が再作成され、次回の検索に時間がかかる場合があります',
}'''
          if marker not in view:
              raise SystemExit('impact labels block not found')
          view_path.write_text(view.replace(marker, replacement))
          PY
      - name: Format
        run: |
          npm install --no-audit --no-fund
          npx prettier --write src/features/AppCacheView.tsx src-tauri/definitions/cache-catalog-v1.json
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/AppCacheView.tsx src-tauri/definitions/cache-catalog-v1.json src-tauri/src/cache_catalog.rs
          git commit -m "feat: add verified Adobe and Blender cache definitions"
          git push origin HEAD:feat/adobe-blender-cache-definitions
