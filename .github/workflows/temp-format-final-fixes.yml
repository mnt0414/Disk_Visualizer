name: Temporary format final fixes
on:
  push:
    branches: [fix/ecc-review-findings]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecc-review-findings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/build.rs src-tauri/src/file_metrics.rs
          git commit -m "style: format final ECC fixes"
          git push origin HEAD:fix/ecc-review-findings
