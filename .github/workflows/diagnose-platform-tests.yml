name: Diagnose platform tests

on:
  push:
    branches: [fix/phase4-windows-volume-tests]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    strategy:
      max-parallel: 1
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-windows-volume-tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Capture test output
        shell: bash
        run: |
          set +e
          log_name="platform-${RUNNER_OS}.log"
          cargo test --manifest-path src-tauri/Cargo.toml > "$log_name" 2>&1
          status=$?
          cat "$log_name"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f "$log_name"
          git commit -m "ci: capture ${RUNNER_OS} platform test log"
          git push
          exit 0
