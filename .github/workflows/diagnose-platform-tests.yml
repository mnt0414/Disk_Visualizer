name: Diagnose platform tests

on:
  push:
    branches: [fix/phase4-windows-volume-tests]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-windows-volume-tests
      - name: Fix canonical metadata path comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/scanner.rs')
          text = path.read_text()
          old = '''        let entry = recorded
              .iter()
              .find(|entry| entry.path == file)
              .expect("file metadata should be reported");'''
          new = '''        let canonical_file = file.canonicalize().unwrap();
          let entry = recorded
              .iter()
              .find(|entry| entry.path == canonical_file)
              .expect("file metadata should be reported");'''
          if text.count(old) != 1:
              raise SystemExit('metadata test marker mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/scanner.rs
          git commit -m "test: compare canonical metadata paths"
          git push
