name: Diagnose platform tests

on:
  push:
    branches: [fix/phase4-windows-volume-tests]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-windows-volume-tests
      - name: Fix canonical metadata path comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/scanner.rs')
          text = path.read_text()
          anchor = '        let entry = recorded\n'
          comparison = '.find(|entry| entry.path == file)'
          if text.count(anchor) != 1 or text.count(comparison) != 1:
              raise SystemExit('metadata test marker mismatch')
          text = text.replace(
              anchor,
              '        let canonical_file = file.canonicalize().unwrap();\n' + anchor,
              1,
          )
          text = text.replace(
              comparison,
              '.find(|entry| entry.path == canonical_file)',
              1,
          )
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/scanner.rs
          git commit -m "test: compare canonical metadata paths"
          git push
