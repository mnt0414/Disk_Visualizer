name: Temporary Rust quality diagnostics

on:
  push:
    branches: [fix/ecc-review-findings]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecc-review-findings
      - name: Skip if captured
        id: guard
        run: if [ -f docs/rust-quality-diagnostics.txt ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.skip != 'true'
        with:
          components: clippy
      - name: Install Tauri Linux dependencies
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Capture clippy
        if: steps.guard.outputs.skip != 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings > docs/rust-quality-diagnostics.txt 2>&1 || true
      - name: Commit diagnostics
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rust-quality-diagnostics.txt
          git commit -m "ci: capture Rust quality diagnostics"
          git push origin HEAD:fix/ecc-review-findings
