name: Temporary wire Windows USN adapter
on:
  push:
    branches: [feat/windows-usn-adapter]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-usn-adapter
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src-tauri/src/lib.rs')
          text=path.read_text().replace('mod storage;\n', 'mod storage;\npub mod windows_usn;\n')
          path.write_text(text)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/windows_usn.rs src-tauri/src/lib.rs src-tauri/Cargo.toml
          git commit -m "feat: wire Windows USN journal adapter"
          git push origin HEAD:feat/windows-usn-adapter
