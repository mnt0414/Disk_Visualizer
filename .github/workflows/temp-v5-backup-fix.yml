name: Temporary v5 backup fix

on:
  push:
    branches: [feat/cache-runtime-state-storage]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-runtime-state-storage
      - name: Apply v5 backup fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/storage.rs')
          text = path.read_text()
          old = '            5 => Self::migrate_v5_to_v6(&connection)?,\n'
          new = '''            5 => {
                self.consistent_backup(&connection, "sqlite3.v5-backup")?;
                Self::migrate_v5_to_v6(&connection)?
            }
'''
          if text.count(old) != 1:
              raise SystemExit('v5 migration branch not found')
          text = text.replace(old, new)
          marker = '''    #[test]
    #[ignore = "manual million-entry benchmark"]
'''
          test = '''    #[test]
    fn migrates_v5_with_consistent_backup() {
        let repository = repository("migration-v5");
        let path = repository.path().to_path_buf();
        {
            let connection = repository.connection().unwrap();
            connection
                .execute_batch(
                    "ALTER TABLE scan_entries DROP COLUMN cache_runtime_state; PRAGMA user_version=5;",
                )
                .unwrap();
        }
        repository.initialize().unwrap();
        let version: i64 = repository
            .connection()
            .unwrap()
            .query_row("PRAGMA user_version", [], |row| row.get(0))
            .unwrap();
        assert_eq!(version, 6);
        assert!(path.with_extension("sqlite3.v5-backup").exists());
        let _ = std::fs::remove_file(path.with_extension("sqlite3.v5-backup"));
        let _ = std::fs::remove_file(path);
    }
    #[test]
    #[ignore = "manual million-entry benchmark"]
'''
          if text.count(marker) != 1:
              raise SystemExit('test insertion point not found')
          path.write_text(text.replace(marker, test))
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/storage.rs
          git commit -m "fix: back up v5 before runtime state migration"
          git push origin HEAD:feat/cache-runtime-state-storage
